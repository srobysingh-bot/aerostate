name: Publish release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish latest manifest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(python - <<'PY'
import json
from pathlib import Path

manifest = json.loads(Path("custom_components/aerostate/manifest.json").read_text())
print(manifest["version"])
PY
)"
          TAG="v${VERSION}"

          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} does not exist; skipping release publish."
            exit 0
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --latest
            echo "Release ${TAG} already exists; marked latest."
            exit 0
          fi

          VERSION="${VERSION}" python - <<'PY'
import os
from pathlib import Path

notes = Path("RELEASE_NOTES.md").read_text()
version = os.environ["VERSION"]
start = notes.index(f"## AeroState v{version}")
try:
    end = notes.index("\n## AeroState v", start + 1)
except ValueError:
    end = len(notes)
Path("release-body.md").write_text(notes[start:end].strip() + "\n")
PY

          gh release create "${TAG}" \
            --title "AeroState ${TAG}" \
            --notes-file release-body.md \
            --latest
